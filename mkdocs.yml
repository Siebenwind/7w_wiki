site_name: Siebenwind Wiki
site_description: Kuratiertes Lore-Archiv der Welt Siebenwind mit transparenten Qualitaetsverfahren.
site_author: Siebenwind Gemeinschaft
copyright: "© 2026 LeCorbeau & Siebenwind Gemeinschaft | Inhalte: Autoren & Projekt Siebenwind"
docs_dir: docs
site_dir: site

repo_name: Siebenwind/7w_wiki
repo_url: https://github.com/Siebenwind/7w_wiki
site_url: https://Siebenwind.github.io/7w_wiki/
edit_uri: edit/main/docs/

extra_css:
  - assets/custom.css

theme:
  name: material
  language: de
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: custom
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: gold
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

nav:
  - Start: index.md
  - Lesen:
    - Startpunkt: Siebenwind_Wiki/index.md
    - Interessante Artikel: Siebenwind_Wiki/10_Archiv/Interessante_Artikel.md
    - Register und Basis:
      - Uebersicht: Siebenwind_Wiki/00_Fundament/index.md
      - Personenregister: Siebenwind_Wiki/00_Fundament/Personenregister.md
      - Organisationsregister: Siebenwind_Wiki/00_Fundament/Organisationsregister.md
      - Zeitrechnung: Siebenwind_Wiki/00_Fundament/Zeitrechnung_(Der_Sonnenzirkel).md
    - Pantheon und Religion:
      - Uebersicht: Siebenwind_Wiki/01_Pantheon/index.md
      - Das Pantheon: Siebenwind_Wiki/01_Pantheon/Das_Pantheon.md
      - Astrael: Siebenwind_Wiki/01_Pantheon/Astrael.md
    - Geografie und Orte:
      - Uebersicht: Siebenwind_Wiki/02_Geografie/index.md
      - Siebenwind: Siebenwind_Wiki/02_Geografie/Siebenwind.md
    - Persoenlichkeiten:
      - Uebersicht: Siebenwind_Wiki/07_Persoenlichkeiten/index.md
    - Bestiarium: Siebenwind_Wiki/00_Fundament/Bestiarium_Register.md
    - Chronik:
        - Uebersicht: Siebenwind_Wiki/04_Chronik/index.md
        - Zeitlinie: Siebenwind_Wiki/04_Chronik/Zeitleiste_(15-30_n.H.).md
    - Archiv und Forschung:
      - Qualitaetsrahmen 2026: Archiv/QUALITAETSRAHMEN_2026.md
      - Research Board: Archiv/Research_Board.md
      - Ingestion Reports: Archiv/Ingestion_Reports/index.md
      - Wiki Statistiken: Siebenwind_Wiki/10_Archiv/Wiki_Statistiken.md
  - Mitwirken:
    - Leitfaden: CONTRIBUTING.md
    - Master Task List: MASTER_TASK_LIST.md
    - Changelog: CHANGELOG.md
    - Redesign Roadmap 2026: Archiv/REDESIGN_ROADMAP_2026.md
  - Betrieb und Technik:
    - Agenten-Hub: Agenten/index.md
    - Operations Handbook: AGENT_OPERATIONS_HANDBOOK.md
    - Interop: Agenten/interop.md
    - Dispatch: Agenten/dispatch.md
    - Workflows und Skills: Agenten/workflows.md
    - Architektur: architecture.md
    - RAG Setup: setup_rag.md
    - Styling-Profil: STYLING.md

plugins:
  - search
  - roamlinks:
      link_relative: true
  - caseinsensitivefiles

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
