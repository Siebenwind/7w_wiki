site_name: Siebenwind Wiki
site_description: Kuratiertes Lore-Archiv der Welt Siebenwind mit transparenten Qualitaetsverfahren.
site_author: Siebenwind Gemeinschaft
copyright: "© 2026 LeCorbeau & Siebenwind Gemeinschaft | Inhalte: Autoren & Projekt Siebenwind"
docs_dir: docs
site_dir: site
# Roh-HTML-Originale bleiben Provenienz und werden nicht veröffentlicht.
exclude_docs: |
  Quellen/_ARCHIV_ORIGINAL/

repo_name: Siebenwind/7w_wiki
repo_url: https://github.com/Siebenwind/7w_wiki
site_url: https://Siebenwind.github.io/7w_wiki/
edit_uri: edit/main/docs/

extra_css:
  - assets/custom.css
extra_javascript:
  - assets/search.js
hooks:
  - .agent/scripts/reader_surface.py

theme:
  name: material
  custom_dir: .agent/templates
  font: false
  language: de
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: custom
      accent: red
      toggle:
        icon: material/brightness-7
        name: Dunkle Darstellung
    - scheme: slate
      primary: black
      accent: gold
      toggle:
        icon: material/brightness-4
        name: Helle Darstellung
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy

nav:
  - Start: index.md
  - Welt entdecken:
    - Überblick: Siebenwind_Wiki/index.md
    - Orte: Siebenwind_Wiki/02_Geografie/index.md
    - Glaube: Siebenwind_Wiki/01_Pantheon/index.md
    - Völker und Gesellschaft: Siebenwind_Wiki/03_Gesellschaft/index.md
    - Magie: Siebenwind_Wiki/05_Magie/index.md
    - Wissen: Siebenwind_Wiki/03_Wissen/index.md
    - Personen: Siebenwind_Wiki/07_Persoenlichkeiten/index.md
    - Geschichte: Siebenwind_Wiki/05_Geschichte/index.md
    - Chronik: Siebenwind_Wiki/04_Chronik/index.md
    - Erzählungen: Siebenwind_Wiki/06_Erzählungen/index.md
    - Bestiarium: Siebenwind_Wiki/08_Bestiarium/index.md
  - Themen A–Z: themen.md
  - Neues: neues.md
  - Quellen & Forschung:
    - Überblick: forschung.md
    - Lesetipps: Siebenwind_Wiki/10_Archiv/Interessante_Artikel.md
    - Forschungsstand: Archiv/Research_Board.md
    - Erschlossene Quellen: Archiv/Ingestion_Reports/index.md
    - Über das Archiv: Siebenwind_Wiki/10_Archiv/Wiki_Statistiken.md
plugins:
  - roamlinks
  - caseinsensitivefiles

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
