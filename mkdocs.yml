site_name: Siebenwind Wiki 2.0
site_description: Das zentrale Wissensarchiv der Siebenwind-Welt.
site_author: Oberarchivar
docs_dir: docs
site_dir: site

repo_name: LeCorbeau/7w_wiki
repo_url: https://github.com/LeCorbeau/7w_wiki
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - 🗞️ Changelog: CHANGELOG.md
  - 🗺️ Wiki-Inhalte:
      - Fundament: Siebenwind_Wiki/00_Fundament/
      - Pantheon: Siebenwind_Wiki/01_Pantheon/
      - Geografie: Siebenwind_Wiki/02_Geografie/
      - Gesellschaft: Siebenwind_Wiki/03_Gesellschaft/
      - Chronik: Siebenwind_Wiki/04_Chronik/
      - Geschichte: Siebenwind_Wiki/05_Geschichte/
      - Erzählungen: Siebenwind_Wiki/06_Erzählungen/
      - Persönlichkeiten: Siebenwind_Wiki/07_Persoenlichkeiten/
      - Bestiarium: Siebenwind_Wiki/08_Bestiarium/
      - Bibliothek: Siebenwind_Wiki/09_Bibliothek/
      - Amtliches Archiv: Siebenwind_Wiki/10_Archiv/
  - 🏗️ Projekt-Management:
      - Master Task List: MASTER_TASK_LIST.md
      - Wiki Statistiken: Siebenwind_Wiki/10_Archiv/Wiki_Statistiken.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

