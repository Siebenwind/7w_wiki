site_name: Siebenwind Lore Engine 2.4
site_description: Das digitale Gedächtnis von Falandrien.
site_author: Siebenwind Gemeinschaft
copyright: "© 2026 LeCorbeau & Siebenwind Gemeinschaft | Inhalte: Autoren & Projekt Siebenwind"
docs_dir: docs
site_dir: site

repo_name: Siebenwind/7w_wiki
repo_url: https://github.com/Siebenwind/7w_wiki
site_url: https://Siebenwind.github.io/7w_wiki/
edit_uri: edit/main/docs/

extra_css:
  - assets/custom.css

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: custom
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: gold
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

nav:
  - 🏠 Home: index.md
  - 🗞️ Changelog: CHANGELOG.md
  - 🤝 Mitarbeit: CONTRIBUTING.md
  - 🗺️ Wiki-Inhalte:
    - 🏰 Startpunkt: Siebenwind_Wiki/index.md
    - 📜 Register & Basis:
      - Übersicht: Siebenwind_Wiki/00_Fundament/index.md
      - Personenregister: Siebenwind_Wiki/00_Fundament/Personenregister.md
      - Organisationsregister: Siebenwind_Wiki/00_Fundament/Organisationsregister.md
      - Zeitrechnung: Siebenwind_Wiki/00_Fundament/Zeitrechnung_(Der_Sonnenzirkel).md
    - 🏛️ Pantheon & Religion:
      - Übersicht: Siebenwind_Wiki/01_Pantheon/index.md
      - Das Pantheon: Siebenwind_Wiki/01_Pantheon/Das_Pantheon.md
      - Astrael: Siebenwind_Wiki/01_Pantheon/Astrael.md
    - 🧭 Geografie & Orte:
      - Übersicht: Siebenwind_Wiki/02_Geografie/index.md
      - Siebenwind: Siebenwind_Wiki/02_Geografie/Siebenwind.md
    - 🎭 Persönlichkeiten:
      - Übersicht: Siebenwind_Wiki/07_Persoenlichkeiten/index.md
    - 🐉 Bestiarium: Siebenwind_Wiki/00_Fundament/Bestiarium_Register.md
    - ⏳ Chronik:
        - Übersicht: Siebenwind_Wiki/04_Chronik/index.md
        - Zeitlinie: Siebenwind_Wiki/04_Chronik/Zeitleiste_(15-30_n.H.).md
    - 🏗️ Projekt-Management:
    - 📚 Das Archiv:
      - 📋 Research Board: Archiv/Research_Board.md
      - 🔬 Ingestion Reports: Archiv/Ingestion_Reports/index.md
    - 📈 Master Task List: MASTER_TASK_LIST.md
    - 📊 Wiki Statistiken: Siebenwind_Wiki/10_Archiv/Wiki_Statistiken.md
    - 🎨 Styling-Profil: STYLING.md

plugins:
  - search
  - roamlinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
