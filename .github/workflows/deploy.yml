name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          ./7w_wiki.py pages setup --browsers
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Physical Sync (Quellen → docs/)
        run: |
          rm -rf docs/Quellen
          cp -rp Quellen docs/

      - name: Synchronize reader surfaces
        run: ./7w_wiki.py stats
      
      - name: Validate and build publication surface
        run: |
          ./7w_wiki.py pages validate --json --skip-audit
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Reader browser acceptance
        run: ./7w_wiki.py test --suite reader-browser

      - name: Rendered internal links
        run: ./7w_wiki.py test --suite reader-rendered-links

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify delivered build identity
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: ./7w_wiki.py pages verify-live --url "$PUBLIC_URL" --commit "$EXPECTED_COMMIT"
