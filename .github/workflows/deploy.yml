name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-roamlinks-plugin mkdocs-mermaid2-plugin

      - name: Build site
        run: |
          mkdocs build

      - name: Generate gh-pages README
        run: |
          echo "# 🚀 Siebenwind Wiki - Deployment Branch" > site/README.md
          echo "Dies ist der automatisierte Deployment-Branch für die GitHub Pages." >> site/README.md
          echo "Der Quellcode und die Dokumentation befinden sich im [main-Branch](https://github.com/Siebenwind/7w_wiki/tree/main)." >> site/README.md
          echo "---" >> site/README.md
          echo "🌐 **Live Wiki:** [https://Siebenwind.github.io/7w_wiki/](https://Siebenwind.github.io/7w_wiki/)" >> site/README.md

      - name: Deploy
        run: |
          mkdocs gh-deploy --force --dirty
